name: Zenith Audio CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_VERSION: 1.3.0

jobs:
  build-linux:
    name: 🐧 Build Linux Server & Debian Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libopus-dev libasound2-dev build-essential dpkg-dev

      - name: Build C++20 Zenith Server
        run: |
          cd server
          make -j$(nproc)
          ./bin/zenith-server --help

      - name: Build Debian Package
        run: |
          PKG=zenith-audio-server_${SERVER_VERSION}_amd64
          mkdir -p /tmp/deb_build/${PKG}/DEBIAN
          mkdir -p /tmp/deb_build/${PKG}/usr/bin
          mkdir -p /tmp/deb_build/${PKG}/usr/lib/systemd/user
          cp server/bin/zenith-server /tmp/deb_build/${PKG}/usr/bin/zenith-server
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/zenith-server --port 59100 --bitrate 320|' \
            scripts/zenith-server.service > /tmp/deb_build/${PKG}/usr/lib/systemd/user/zenith-server.service
          strip /tmp/deb_build/${PKG}/usr/bin/zenith-server
          cat << EOF > /tmp/deb_build/${PKG}/DEBIAN/control
          Package: zenith-audio-server
          Version: ${SERVER_VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libpipewire-0.3-0, libopus0, libstdc++6
          Maintainer: Mohd Uwais Ghosi <mohduwaisghosi@gmail.com>
          Description: Zenith Ultra-Low Latency Audio Server
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/deb_build/${PKG}/DEBIAN/control
          dpkg-deb --build --root-owner-group /tmp/deb_build/${PKG} ${PKG}.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenith-server-linux
          if-no-files-found: error
          path: |
            server/bin/zenith-server
            zenith-audio-server_${{ env.SERVER_VERSION }}_amd64.deb

  build-android:
    name: 📱 Build Android App APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build and Test Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: zenith-audio-apk-debug-signed
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*.apk
